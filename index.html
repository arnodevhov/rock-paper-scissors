<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <script src="script.js" defer></script> -->
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1 class="main-title">Rock Paper Scissors</h1>
        <button class="btn" id="start-game">Start game</button>
      </div>
      <div class="game">
        <div class="score">
          <p id="human-score">Human 0</p>
          <p id="computer-score">Computer 0</p>
        </div>
        <div class="game-buttons">
          <button class="btn">Rock</button>
          <button class="btn">Paper</button>
          <button class="btn">Scissors</button>
        </div>
        <p id="message">Computer wins round</p>
        <button id="new-game" class="btn">New game</button>
      </div>
    </div>
  </body>
</html>
